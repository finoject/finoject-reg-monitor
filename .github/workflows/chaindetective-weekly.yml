name: chaindetective-weekly

# Chaindetective 週次グローバル規制・AML動向ブリーフィングを Slack #金融規制情報 へ投稿する。
#
# ★定例の投稿はこのワークフローではない。手動起動（workflow_dispatch）専用の予備経路である。
#
# 経緯（2026-09-01）:
#   ローカルのスケジュールタスク（~/.claude/scheduled-tasks/chaindetective-weekly-briefing）が
#   7/28 の初回手動実行以降ひとつも発火していなかったため、常時稼働する Actions へ移設した。
#   **しかしその判断は、クラウドのルーティンが既に同じ仕事をしていることを見落としていた。**
#
#   クラウドのルーティン `chaindetective-weekly-briefing`（三根さんが 2026-08-27 に作成・
#   毎週金曜 17:03 JST・母艦の環境で実行）が 2026-08-28 に実際に #金融規制情報 へ投稿している
#   （Slack実測で確認）。動いていなかったのは「ローカルのスケジュールタスク」のほうだった。
#
#   そのまま cron を残すと 17:03 と 17:07 で同じチャンネルへ二重投稿になる。
#   定例はクラウドのルーティンを正とし、ここは schedule を外して予備に降ろす。
#
# なぜクラウド側を残したか:
#   - 本番で投稿実績がある（8/28）。こちらは一度も動いていない
#   - 三根さん自身が作ったもので、投稿者が三根さん名義になる。
#     このワークフローは incoming-webhook 名義になり、同居する日次の新着通知と見分けが付かない
#   - GitHub の schedule は現在ひどく間引かれている（巡回は1日24回の設定に対し実測2〜6回）。
#     週1回しか枠が無いジョブは、1週まるごと落ちうる
#   - CLAUDE.md の方針:「作る前に既にあるものを確認する」「既存の仕組みに収まるなら増やさない」
#
# 予備として残す理由:
#   クラウドのルーティンが失敗した週に、母艦から workflow_dispatch で叩けば埋められる。
#   その場合は 17:03 の回が失敗していることを確認してから叩くこと（二重投稿になる）。
#
# レポート本文の生成は Cloudflare Worker の /ai（task=briefing）に投げる。
# ANTHROPIC_API_KEY は Worker のsecretにあり、このリポジトリには置かない。

on:
  # schedule は意図的に外してある（上記のとおり二重投稿になるため）。復活させるときは
  # 必ずクラウドのルーティン側を止めてからにすること。
  workflow_dispatch:
    inputs:
      week_end:
        description: '対象週の終端（金曜・YYYY-MM-DD）。空なら直近の金曜'
        required: false
        type: string
      dry_run:
        description: '収集だけ行い、レポート生成もSlack投稿もしない（動作確認用）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read   # 何もコミットしない。読むだけ。

concurrency:
  group: chaindetective-weekly
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 収集 → レポート生成 → Slack投稿
        working-directory: reg-monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Worker側に BRIEFING_TOKEN を設定して /ai を保護する場合のみ、同名secretをここにも登録する。
          # 両方未設定でも動く（Worker側が未設定なら検査しない）。
          BRIEFING_TOKEN: ${{ secrets.BRIEFING_TOKEN }}
          # 入力はシェルに直接展開せず環境変数経由で渡す（スクリプトインジェクション回避）
          WEEK_END: ${{ inputs.week_end }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$WEEK_END" ]; then ARGS+=(--week-end "$WEEK_END"); fi
          # scheduleからの起動では DRY_RUN は空。明示的に true のときだけ収集で止める。
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          node chaindetective-weekly.js "${ARGS[@]}"
