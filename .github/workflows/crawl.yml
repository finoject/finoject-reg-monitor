name: crawl-and-publish

on:
  schedule:
    # 毎時:37に巡回（1日24回）。法令ビューアの「関連ニュース」はこの data.json を直読みするため、
    # ニュースを常時最新に保つには高頻度が要る（三根さん指示2026-06-17）。
    # 分は :00 を避ける（GitHubは毎時0分が最も混雑し schedule がドロップ/遅延しやすい＝公式注意。:37で回避）。
    - cron: '37 * * * *'   # 毎時37分 = JST 毎時37分（1日24回）
  workflow_dispatch:          # 手動実行も可能

permissions:
  contents: write   # data.json をリポジトリに追記コミットするため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # ハングしても20分で打ち切り＝concurrency(group:pages)のロックを永久に握らせない（巡回が詰まる事故の再発防止）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PDF抽出ツール（法令連携の本文解析用）
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: 依存インストール
        working-directory: reg-monitor
        run: npm install

      - name: 巡回（6機関の新着を取得し data.json を更新／新規分をSlackへ）
        working-directory: reg-monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node crawler.js

      - name: 差分データをコミット（蓄積を永続化）
        run: |
          git config user.name "reg-monitor-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reg-monitor-site/data.json
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore: update data.json ($(date -u +%FT%TZ))"
          # push の失敗を握り潰さない。握り潰すと Pages にはこの回のデータが出るのに
          # main には残らず、次回は古い data.json から始まって同じURLを再び新規扱いし、
          # Slackへ重複通知する（蓄積も失われる）。weekly-brief.yml と同じく取り直して押す。
          for i in 1 2 3; do
            # GitHub Actions の bash は -e で走るため、rebase が競合すると
            # ここで無言のままステップが終わり、再試行に到達しない。明示的に受け止める。
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              echo "rebaseが競合しました（${i}回目）。中断して取り直します"
              git rebase --abort || true
              if [ "$i" -lt 3 ]; then sleep $((i * 10)); continue; fi
              echo "::error::data.json のrebaseが解消できませんでした"
              exit 1
            fi
            if git push; then
              echo "push成功（${i}回目）"
              exit 0
            fi
            echo "pushに失敗（${i}回目）。取り直して再試行します"
            if [ "$i" -lt 3 ]; then sleep $((i * 10)); fi
          done
          echo "::error::3回試行してもpushできませんでした"
          exit 1

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reg-monitor-site
      - id: deployment
        uses: actions/deploy-pages@v4

      # 「巡回は回っているのに中身が取れていない」種類の異常は、公開を止めずに最後で気づく。
      # ここで落とすことで、失敗通知（Actionsの失敗メール/Slack連携）が鳴る。
      - name: 巡回の健全性チェック（0件成功・補助データの空取得）
        if: always()
        working-directory: reg-monitor
        run: |
          if [ -s .crawl-warnings ]; then
            echo "::error::巡回の健全性に問題があります（data.json の公開は完了しています）"
            cat .crawl-warnings
            exit 1
          fi
          echo "健全性チェック: 問題なし"

